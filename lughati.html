<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الحروف</title>

<body>

<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* concept: a bright schoolbook map. Deep-green banner, cream dotted paper, chunky buttons that press down like keys.
   color: green (main), sun yellow (reward), coral, sky, plum (game accents), ink navy text.
   type: Baloo Bhaijaan 2 for titles, Cairo for letters, words and body. */
:root{
 --paper:#fff7e4;--paper2:#ffeec2;--card:#ffffff;--ink:#1d2b53;--mut:#5f6a8f;--line:#ecdcb0;
 --green:#0f9d6b;--green-d:#0a7550;--sun:#ffc23d;--sun-d:#d99a00;--coral:#ff6a5c;--coral-d:#d8473a;
 --sky:#2fa8f0;--sky-d:#1479b8;--plum:#7a4cff;--plum-d:#5a30d6;--hd:#0b6e4f;--hdx:#fff7e4;
 --hint:#fff0b8;--hintx:#5a4200;--okbg:#d9f7e8;--okx:#0a5a3d;--sea1:#8fd3ff;--sea2:#2a86d4;--sea3:#12468a;--sky1:#d4f0ff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#161f3f;--paper2:#1c2750;--card:#243158;--ink:#f6f1e3;--mut:#b7bfdc;--line:#37457a;--hd:#0a4d39;
 --hint:#4b3b0a;--hintx:#ffe6a0;--okbg:#0f4a38;--okx:#bff3dc;--sea1:#3e78c4;--sea2:#1f4f98;--sea3:#0f2a5e;--sky1:#2a4682;color-scheme:dark}}
:root[data-theme="dark"]{
 --paper:#161f3f;--paper2:#1c2750;--card:#243158;--ink:#f6f1e3;--mut:#b7bfdc;--line:#37457a;--hd:#0a4d39;
 --hint:#4b3b0a;--hintx:#ffe6a0;--okbg:#0f4a38;--okx:#bff3dc;--sea1:#3e78c4;--sea2:#1f4f98;--sea3:#0f2a5e;--sky1:#2a4682;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);background-image:radial-gradient(var(--line) 1.3px,transparent 1.5px);background-size:26px 26px;color:var(--ink);
 font-family:'Cairo',Tahoma,Arial,sans-serif;font-size:18px;direction:rtl;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
#wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;margin:0;line-height:1.35;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px}h3{font-size:19px}
.hd{margin-top:12px;background:var(--hd);color:var(--hdx);border-radius:26px;padding:14px 16px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;box-shadow:0 6px 0 rgba(0,0,0,.2);position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;inset:auto 0 0 0;height:7px;background:repeating-linear-gradient(90deg,var(--sun) 0 18px,transparent 18px 30px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{font-size:38px;width:58px;height:58px;flex:none;display:grid;place-items:center;background:var(--sun);border-radius:18px;box-shadow:0 4px 0 var(--sun-d)}
.brand b{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-size:27px;line-height:1.1;display:block}
.brand small{display:block;font-size:13px;opacity:.92}
.by{color:var(--sun);font-weight:700;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.17);border-radius:999px;padding:5px 14px;font-size:15px;font-weight:700}
.chip i{color:var(--sun);font-style:normal}
#app{padding-top:14px;min-width:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.mut{color:var(--mut);font-size:15px}
button{font-family:inherit;font-size:18px;font-weight:800;border:0;border-radius:18px;padding:12px 20px;cursor:pointer;color:#fff;background:var(--c,var(--green));
 box-shadow:0 5px 0 var(--cd,var(--green-d));transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--cd,var(--green-d))}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
button.alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
input{font-family:inherit;font-size:22px;padding:12px 14px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg button{flex:1;background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.seg button.on{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 5px 0 var(--green-d)}
.hero{text-align:center;display:grid;gap:12px;justify-items:center;padding:22px 16px}
.owl{font-size:56px;display:inline-block;animation:bob 2.6s ease-in-out infinite}.hero .owl{font-size:96px}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.hero label{font-weight:800}.hero input{max-width:360px;text-align:center}
.ptop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.pb{position:relative;height:16px;background:var(--line);border-radius:99px}
.pb i{display:block;height:100%;background:var(--green);border-radius:99px;min-width:8px;transition:width .4s}
.rk{position:absolute;top:-14px;font-size:28px;inset-inline-start:max(0px,calc(var(--x,0%) - 20px));transition:inset-inline-start .4s}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:30px 12px;padding-bottom:22px}
.st{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:40px;font-weight:900;line-height:1.15;padding:10px 4px 8px;border-radius:24px;
 --c:hsl(var(--h) 76% 52%);--cd:hsl(var(--h) 70% 33%)}
.st small{font-size:13px;font-weight:700;min-height:18px;letter-spacing:1px}
.st:nth-child(even){transform:translateY(12px)}.st:nth-child(even):active:not(:disabled){transform:translateY(16px)}
.st.lock{--c:#b9b3a0;--cd:#8f897a}
.st.done small{color:#fff6b8}
.bal{aspect-ratio:1;border-radius:50%;font-size:38px;padding:0;--c:hsl(var(--h) 76% 52%);--cd:hsl(var(--h) 70% 33%)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.lhero{display:flex;align-items:center;justify-content:space-around;gap:12px;flex-wrap:wrap;border:0;color:#fff;background:hsl(var(--h) 70% 46%);box-shadow:0 7px 0 hsl(var(--h) 70% 30%)}
.lhero .big{font-size:120px;font-weight:900;line-height:1.2}
.lhero button{--c:#fff;--cd:rgba(0,0,0,.25);color:#1d2b53}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.forms div{background:var(--paper2);border-radius:16px;padding:8px 2px}
.forms b{display:block;font-size:44px;line-height:1.3}.forms small{color:var(--mut);font-weight:700;font-size:13px}
.vow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vow div{text-align:center}.vow button{width:100%;font-size:34px;padding:10px 4px;--c:var(--card);--cd:var(--line);color:var(--ink);border:2px solid var(--line)}
.vow small{display:block;color:var(--mut);font-size:13px;font-weight:700;margin-top:4px}
.w{font-size:28px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:96px;line-height:1.5;--c:var(--card);--cd:var(--line);color:var(--ink);border:2px solid var(--line)}
.pic{font-size:44px;line-height:1.2;display:block}
.note{background:var(--hint);color:var(--hintx);border-radius:16px;padding:10px 14px;font-size:15px;font-weight:700;margin-bottom:14px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.gt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;padding:12px 14px;border-radius:20px;box-shadow:0 6px 0 var(--cd)}
.gt .gi{font-size:30px;line-height:1.2}.gt b{font-size:18px;font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;line-height:1.3}.gt small{font-weight:600;font-size:12px;opacity:.95;line-height:1.4}.gt em{font-style:normal;color:#fff6b8;letter-spacing:2px;min-height:20px}
.go{font-size:22px;padding:14px 30px}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chip2{background:var(--paper2);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:800;font-size:15px}
.dots{display:flex;gap:6px;margin-inline-start:auto}.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}.dots i.d{background:var(--green)}.dots i.c{background:var(--sun);box-shadow:0 0 0 3px var(--paper2)}
.mascot{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.bub{flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 14px;font-size:21px;font-weight:800;display:flex;gap:10px;align-items:center;justify-content:space-between;position:relative}
.bub::before{content:"";position:absolute;inset-inline-start:-9px;top:20px;width:14px;height:14px;background:var(--card);border-inline-start:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.sp{flex:none;width:52px;height:52px;padding:0;border-radius:50%;font-size:24px;--c:var(--sky);--cd:var(--sky-d)}
.sayb{--c:var(--sky);--cd:var(--sky-d);font-size:20px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.o{font-size:32px;padding:18px 8px;line-height:1.5}
.o:nth-child(4n+1){--c:var(--sky);--cd:var(--sky-d)}.o:nth-child(4n+2){--c:var(--coral);--cd:var(--coral-d)}.o:nth-child(4n+3){--c:var(--plum);--cd:var(--plum-d)}.o:nth-child(4n){--c:#e08a00;--cd:#a86500}
.o.g{--c:var(--green);--cd:var(--green-d)}.o.r{--c:#9a9ab0;--cd:#74748a;opacity:.55}
.fb{border-radius:16px;padding:10px 14px;margin-top:14px;font-weight:800}
.fb.hint{background:var(--hint);color:var(--hintx)}.fb.ok{background:var(--okbg);color:var(--okx)}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slot{font-size:36px;font-weight:800;min-width:56px;height:64px;display:grid;place-items:center;border-bottom:5px solid var(--green)}
.tile{font-size:38px;font-weight:800;min-width:74px;height:84px;padding:0 10px;--c:var(--card);--cd:var(--line);color:var(--ink);border:3px solid var(--line);border-radius:20px;line-height:1.4}
.tile:disabled{opacity:.25}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
.gtitle{text-align:center;font-weight:800;margin-bottom:8px}
.track{position:relative;margin:24px 8px 20px;height:6px;background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 24px);border-radius:9px}
.track .rk{top:-24px;inset-inline-start:calc(var(--p,0)*(100% - 40px))}.track .fl{position:absolute;top:-24px;inset-inline-end:0;font-size:28px}
.sl2{display:inline-block;min-width:60px;height:80px;margin:0 3px;border:4px dashed var(--line);border-radius:18px;vertical-align:middle;font-size:46px;line-height:1.6;text-align:center;font-weight:800}
.sl2.f{border-style:solid;border-color:var(--green);background:var(--okbg)}
.slotrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.ghost{text-align:center;font-size:40px;font-weight:800;color:var(--mut);margin-top:10px;opacity:.7}
.wline{text-align:center;font-size:56px;font-weight:800;line-height:1.9;margin:6px 0 10px;overflow-wrap:anywhere}.wline.s{font-size:40px}
.gap{display:inline-block;min-width:1.05em;height:1.15em;border:4px dashed var(--plum);border-radius:14px;vertical-align:middle;margin:0 2px;font-size:.8em;color:var(--plum);line-height:1.1}
.fx{color:var(--green)}
.fopts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}.fopts .o{font-size:52px;min-width:104px;padding:12px 10px}
.fopts .o.t{font-size:30px;min-width:110px}.fopts .o.e{font-size:60px;min-width:96px;padding:10px}
.hookc{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hookc .qt{flex:1;min-width:180px;font-weight:800;font-size:20px}
.syl2{font-size:64px;font-weight:900;line-height:1.5;white-space:nowrap}
.scene{border-radius:24px;overflow:hidden;border:3px solid var(--line);margin-top:12px}
.sky{height:96px;background:var(--sky1);position:relative}
.sun{position:absolute;top:14px;inset-inline-end:18px;width:52px;height:52px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 9px rgba(255,194,61,.3)}
.boat{position:absolute;bottom:-6px;inset-inline-start:30%;font-size:54px}.cld{position:absolute;top:16px;inset-inline-start:8%;font-size:34px;opacity:.9}
.water{position:relative;height:240px;background:linear-gradient(180deg,var(--sea1),var(--sea2) 55%,var(--sea3))}
.fishes{position:absolute;inset:0;display:flex;justify-content:space-around;align-items:center;gap:4px;padding:0 14px}
.fishb{flex:1;min-width:0;max-width:130px;background:none;box-shadow:none;border:0;padding:4px;animation:swim 3.6s ease-in-out infinite}
.fishb svg{width:100%;height:auto;display:block}
.fishb:nth-child(2){animation-delay:-1.2s;margin-top:70px}.fishb:nth-child(3){animation-delay:-2.4s;margin-top:-30px}
.fishb:active:not(:disabled){transform:none;box-shadow:none}
@keyframes swim{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.fishb.caught{animation:jump .9s ease forwards}@keyframes jump{to{transform:translateY(-250px) scale(.8);opacity:0}}
.fishb.r{opacity:.35;animation:none}
.bubble{position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.4)}
/* syllable windows + analysis */
.wins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.wins>div{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:0}
.win{background:var(--card);color:var(--ink);border:5px solid hsl(var(--h) 60% 48%);border-radius:22px;box-shadow:0 6px 0 hsl(var(--h) 60% 34%);font-size:36px;line-height:1.5;min-height:130px;padding:6px 2px;display:grid;place-items:center;overflow-wrap:anywhere}
.win.lock{opacity:.5}.win.l3{font-size:28px}
.cap{text-align:center;font-size:13px;font-weight:700;color:var(--mut)}
.syb{display:inline-block;padding:4px 14px;border-radius:16px;background:hsl(var(--h) 65% 46%);color:#fff;font-size:36px;font-weight:800;margin:3px;line-height:1.5}
.lets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.lets span{min-width:48px;text-align:center;font-size:34px;font-weight:800;background:var(--paper2);border-radius:14px;padding:2px 8px}
.cf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.cf span{position:absolute;top:-40px;animation:fall 1.5s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(300deg)}}
.big-res{text-align:center;display:grid;gap:10px;justify-items:center}.big-res .stars{font-size:64px;letter-spacing:6px}
.ft{margin-top:22px;text-align:center;background:var(--hd);color:var(--hdx);border-radius:22px;padding:14px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.ft b{color:var(--sun);font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-size:21px}.ft small{display:block;font-weight:500;opacity:.8;margin-top:4px;font-size:12px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:16px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tag{display:inline-block;border-radius:10px;padding:2px 10px;color:#fff;font-size:14px}
.cell{display:inline-block;width:40px;text-align:center;border-radius:10px;margin:2px;padding:4px 0;color:#fff;font-weight:700}
.mini{width:48px;padding:8px 0;font-size:20px;--c:#b9b3a0;--cd:#8f897a}.mini.on{--c:var(--green);--cd:var(--green-d)}
.minis{display:flex;flex-wrap:wrap;gap:8px}
.bar2{height:12px;background:var(--line);border-radius:8px;overflow:hidden}.bar2 i{display:block;height:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:8px 0 12px}
.kpis div{background:var(--paper2);border-radius:16px;padding:10px;text-align:center}.kpis b{display:block;font-size:26px;font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;line-height:1.3}.kpis span{font-size:13px;color:var(--mut);font-weight:700}
.ins{background:var(--hint);color:var(--hintx);border-radius:16px;padding:10px 14px;font-weight:700;font-size:16px;margin:8px 0 14px}
.chart{display:grid;gap:6px;margin:8px 0 16px}.br{display:grid;grid-template-columns:auto 1fr 46px;gap:8px;align-items:center}.bk{min-width:30px;font-weight:800;font-size:15px}.bp{font-size:14px;font-weight:800;text-align:start}
.stack{display:flex;height:22px;border-radius:12px;overflow:hidden;background:var(--line);margin:8px 0}.stack i{display:block;min-width:0}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:700;margin-bottom:14px}.leg u{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
@media print{body{background:#fff!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.noprint,.hd,.ft,.top button{display:none!important}.card{border:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){h1{font-size:25px}.lhero .big{font-size:96px}.forms b{font-size:36px}.wline{font-size:44px}.syl2{font-size:52px}.win{font-size:30px}.win.l3{font-size:23px}}
</style>
<div id="wrap">
<header class="hd"><div class="brand"><span class="logo">🦉</span><div><b>رحلة الحروف</b><small>لغتي • الصف الأول الابتدائي</small><span class="by">إعداد: فاطمة المطيري</span></div></div><div class="chips" id="who"></div></header>
<main id="app"></main>
<footer class="ft">إعداد: <b>فاطمة المطيري</b><small id="vn"></small></footer>
</div>
<script>
document.documentElement.lang='ar';document.documentElement.dir='rtl';
/* U: [letter, words, sentence, provisional]. provisional=1 means the words were chosen by the assistant, not taken from the book. */
const U=[
['م',['مِشْعَل','فَاطِمَة','أُمِّي','مَرْيَم'],'أَبِي سَعْدٌ وَأُمِّي مَرْيَمُ'],
['ب',['بَيْت','مَكْتَبَة','حَاسُوب','كُتُب','بِلَادِي'],'فِي بَيْتِنَا مَكْتَبَةٌ فِيهَا كُتُبٌ وَحَاسُوبٌ'],
['ل',['لِمَاذَا','جَلَسَتْ','يَغْسِلُ','الْأَكْل','قَبْل'],'هُوَ يَغْسِلُ يَدَيْهِ'],
['د',['دَرَّاجَة','وَرْد','حَدِيقَة','دُمْيَة','خَالِد'],'وَأَنَا أَلْعَبُ مَعَ صَدِيقِي خَالِدٍ'],
['ن',['نُورَة','نَحْنُ','نَظَافَة','تَعَاوُن','تَكْنُسُ'],'وَأُمِّي تَكْنُسُ'],
['ر',['رَحَّبَ','رَأْس','يَاسِر','فَرْحَة'],'أَنَا فَرِحَةٌ بِقُدُومِ جَدِّي'],

/* ---- training ---- */
function mk(s,p,items,ok,hint){return{s,p,o:shuf(items.map((t,j)=>({t,ok:j===ok}))),hint,tries:0}}
const dq=(w,s)=>({s:s||'الإملاء',p:'اسمع الكلمة ثم رتّب حروفها',dict:1,a:parseW(keepSh(w)),word:w,tries:0});
function build(i){
 const [L,ws,sn]=U[i],t=nz(L),Q=[],sy=SY(L);
 Q.push(mk('الحركات القصيرة','أين الضمّة؟ (حرف '+L+')',sy.slice(0,3),1,'الضمّة تشبه الواو الصغيرة فوق الحرف'));
 Q.push(mk('الحركات الطويلة','أين المدّ بالياء؟',sy.slice(3),2,'المدّ بالياء: كسرة ثم ياء'));
 const ot=shuf(POOL.filter(w=>!nz(w).includes(t))).slice(0,2);
 Q.push(mk('تمييز الحرف','أيّ كلمة فيها حرف ('+L+')؟',[shuf(ws)[0],...ot],0,'انطق كل كلمة وانتبه لصوت الحرف'));
 const w2=ws.find(w=>nz(w).split(t).length===2)||ws[0],p=nz(w2).indexOf(t),n2=nz(w2).length;
 Q.push(mk('موقع الحرف','أين حرف ('+L+') في كلمة «'+w2+'»؟',['أول الكلمة','وسط الكلمة','آخر الكلمة'],p===0?0:p===n2-1?2:1,'انظر إلى مكان الحرف في الكلمة'));
 let v=null;
 for(const w of ws){const m=[...w];for(let k=0;k<m.length-1;k++){if(nz(m[k])===t&&'َُِ'.includes(m[k+1])){v=[w,m[k],m[k+1]];break}}if(v)break}
 if(v)Q.push(mk('تجريد الحرف','أجرّد الحرف من كلمة «'+v[0]+'» وأقرؤه:',[v[1]+'َ',v[1]+'ُ',v[1]+'ِ'],'َُِ'.indexOf(v[2]),'انطق أول مقطع في الكلمة'));
 const n=tiles(ws[0]).length;
 Q.push(mk('التحليل','كم حرفًا في كلمة «'+ws[0]+'»؟',[n-1,n,n+1].map(String),1,'عُدّ الحروف: '+tiles(ws[0]).join(' - ')));
 const sw=[...ws,...POOL].find(w=>w.includes('ّ'));
 Q.push(mk('الشدّة','أيّ كلمة فيها شدّة؟',[sw,...shuf(POOL.filter(w=>!w.includes('ّ'))).slice(0,2)],0,'الشدّة علامة تشبه حرف (ـّ) فوق الحرف'));
 const w3=shuf(ws)[0];
 Q.push(Object.assign(mk('الاستماع والقراءة','اضغط 🔊 ثم اختر الكلمة التي سمعتها',[w3,...shuf(ws.filter(x=>x!==w3)).slice(0,2)],0,'استمع مرة أخرى'),{say:w3}));
 if(sn)Q.push({s:'قراءة جملة',p:'رتّب الكلمات لتكوّن جملة',ord:sn.split(' '),sep:' ',word:sn,tries:0});
 Q.push(dq(ws[ws.length>2?2:0]));
 Q.forEach(q=>{q.sp=q.p.replace('('+L+')',NS[L]).replace('حرف '+L,'حرف '+NS[L])});
 return Q;
}
function start(i,only,enrich){
 let qs=build(i);if(only)qs=qs.filter(q=>only.includes(q.s));
 if(enrich){const ws=U[i][1];qs=[dq(ws[1],'إثراء: إملاء'),dq(ws[ws.length-1],'إثراء: إملاء')]}
 S={i,qs,k:0,enrich};q();
}
const dotsH=(n,k)=>`<div class="dots">${Array.from({length:n},(_,j)=>`<i class="${j<k?'d':j===k?'c':''}"></i>`).join('')}</div>`;
function q(){
 const Q=S.qs[S.k],a=$('#app');scrollTo(0,0);
 const head=`<div class="qtop"><button class="alt" onclick="learn(${S.i})">رجوع</button><span class="chip2">${esc(Q.s)}</span>${dotsH(S.qs.length,S.k)}</div>`;
 const bub=mascot(Q.p,Q.sp||Q.p);
 const sp=(Q.say||Q.word)?`<p class="row"><button class="sayb" data-say="${esc(Q.say||Q.word)}">🔊 اسمع</button></p>`:'';
 if(Q.dict||Q.ord){Q.pos=[];Q.tl=Q.dict?shuf(Q.a.map((x,k)=>({key:x.b+x.m,t:shp(Q.a,k),u:0}))):shuf(Q.ord.map(t=>({t,u:0})));
  a.innerHTML=head+bub+`<div class="card">${sp}<div class="slots" id="sl"></div><div class="row" id="tl"></div><p class="row"><button class="alt" onclick="clr()">مسح</button></p><div id="msg"></div></div>`;dr();return}
 a.innerHTML=head+bub+`<div class="card">${sp}<div class="opts" id="op">${Q.o.map((o,j)=>`<button class="o" onclick="ans(${j})">${esc(o.t)}</button>`).join('')}</div><div id="msg"></div></div>`;
}
function ans(j){
 const Q=S.qs[S.k],o=Q.o[j],b=$('#op').children[j];if(Q.done)return;
 if(o.ok){b.classList.add('g');$('#msg').innerHTML=`<div class="fb ok">${praise()}</div>`;fin(Q)}
 else{Q.tries++;b.classList.add('r');b.disabled=true;$('#msg').innerHTML=`<div class="fb hint">حاول مرة أخرى. ${esc(Q.hint||'')}</div>`}
}
function dr(){
 const Q=S.qs[S.k];
 $('#sl').innerHTML=Q.pos.map((p,k)=>`<span class="slot">${Q.dict?shp(Q.a,k):p.t}</span>`).join('')||'<span class="slot">&nbsp;</span>';
 $('#tl').innerHTML=Q.tl.map((x,j)=>`<button class="tile" ${x.u?'disabled':''} onclick="pk(${j})">${x.t}</button>`).join('');
 const n=Q.dict?Q.a.length:Q.tl.length;
 if(Q.pos.length===n){
  const ok=Q.dict?Q.pos.every((p,k)=>p.key===Q.a[k].b+Q.a[k].m):Q.pos.map(p=>p.t).join(Q.sep)===Q.ord.join(Q.sep);
  if(ok){$('#msg').innerHTML=`<div class="fb ok">${praise()} <span style="font-size:30px">${esc(Q.word)}</span></div>`;fin(Q)}
  else{Q.tries++;$('#msg').innerHTML=`<div class="fb hint">ليست صحيحة. انظر: ${esc(Q.word)}</div>`;setTimeout(clr,1800)}
 }
}
function pk(j){const Q=S.qs[S.k];if(Q.done)return;Q.tl[j].u=1;Q.pos.push(Q.tl[j]);dr()}
function clr(){const Q=S.qs[S.k];if(!Q||Q.done)return;Q.tl.forEach(x=>x.u=0);Q.pos=[];$('#msg').innerHTML='';dr()}
function fin(Q){
 Q.done=1;burst();log({letter:ORD[S.i],skill:Q.s,ok:Q.tries===0,tries:Q.tries,enrich:!!S.enrich});
 setTimeout(()=>{S.k++;S.k<S.qs.length?q():end()},1300);
}
function end(){
 const L=ORD[S.i],tot=S.qs.length,good=S.qs.filter(x=>x.tries===0).length,weak=[...new Set(S.qs.filter(x=>x.tries>0).map(x=>x.s))],p=Math.round(good/tot*100);
 if(!S.enrich){DONE[L]=Math.max(DONE[L]||0,p>=85?3:p>=60?2:1);saveLocal()}updHd();
 const nx=S.i+1<U.length&&open(ORD[S.i+1]);
 $('#app').innerHTML=`<div class="card big-res"><span class="owl">🦉</span><div class="stars" style="color:var(--sun-d)">${'★'.repeat(p>=85?3:p>=60?2:1)}</div><h2>نتيجتك ${p}%</h2>
 ${weak.length?`<div class="fb hint">معالجة: لنُعد التدريب على (${weak.map(esc).join('، ')})</div><button onclick='start(${S.i},${JSON.stringify(weak)})'>أعد المحاولة</button>`:''}
 ${p>=85&&!S.enrich?`<div class="fb ok">إثراء: ممتاز! جرّب التحدّي</div><button onclick="start(${S.i},null,1)">ابدأ التحدّي</button>`:''}
 <button style="--c:var(--plum);--cd:var(--plum-d)" onclick="learn(${S.i});setTimeout(()=>$('#gm').scrollIntoView(),30)">ألعاب المهارات</button>
 ${nx?`<button onclick="learn(${S.i+1})">الحرف التالي</button>`:''}<button class="alt" onclick="home()">الرئيسية</button></div>`;
 burst();
}
/* ================= skill games ================= */
function holeH(a,h){   // the word as two joined runs around an empty box; tatweel shows the missing letter's connections
 const pre=whole(a.slice(0,h)),post=whole(a.slice(h+1));
 return `<span>${pre}${jb(a,h)?TT:''}</span><span class="gap">؟</span><span>${jf(a,h)?TT:''}${post}</span>`;
}
const fullH=a=>`<span class="fx">${whole(a)}</span>`;
const picH=w=>PIC[w]?`<span class="pic" style="text-align:center">${PIC[w]}</span>`:'';
function gWords(i){return U[i][1].filter(w=>{const n=parseW(w).length;return n>=3&&n<=6}).slice(0,3).map(w=>({w,a:parseW(w)}))}
function gForms(i){
 const c=U[i][0]==='أ'?'ا':U[i][0],ws=U[i][1],cand=[];
 for(const w of [...ws,...POOL.filter(x=>!ws.includes(x))]){const a=parseW(w);a.forEach((x,k)=>{if(x.b===c)cand.push({w,a,k,f:fidx(a,k),c})})}
 const out=[],seen=new Set();
 for(const r of cand){if(!seen.has(r.f)&&out.length<3){seen.add(r.f);out.push(r)}}
 for(const r of cand){if(out.length>=3)break;if(!out.some(x=>x.w===r.w))out.push(r)}
 return out;
}
const MM={'َ':['ا','الفتحة'],'ُ':['و','الضمة'],'ِ':['ي','الكسرة']};
const MDN={'ا':'الألف','و':'الواو','ي':'الياء'};
function gMadd(i){
 const L=U[i][0],R=[];
 if(L!=='أ')for(const m of Object.keys(MM)){if((L==='و'&&m==='ُ')||(L==='ي'&&m==='ِ'))continue;R.push({c:L,m,md:MM[m][0],a:null})}
 const found=[];
 for(const w of [...U[i][1],...POOL]){const a=parseW(w);for(let k=0;k<a.length-1;k++){const mm=MM[a[k].m];if(mm&&a[k+1].b===mm[0]&&a[k+1].m===''&&!found.some(f=>f.w===w))found.push({c:a[k].b,m:a[k].m,md:mm[0],a,hole:k+1,w})}}
 const own=found.filter(f=>U[i][1].includes(f.w));
 const pick=[...own,...found.filter(f=>!own.includes(f))].slice(0,L==='أ'?3:2);
 return [...R,...pick];
}
function gSuk(i){
 const out=[];
 for(const w of [...U[i][1],...POOL.filter(x=>!U[i][1].includes(x))]){
  if(out.length>=3)break;const a=parseW(w),k=sukAt(a);if(k<0||out.some(r=>r.w===w))continue;
  const sy=syls(a),open=sylT(a,k-1,k-1),closed=sylT(a,k-1,k);
  const vs=['َ','ُ','ِ'],v=vowelOf(a[k-1]),alt=vs.find(x=>x!==v);
  const altT=(jb(a,k-1)?TT:'')+a[k-1].b+alt+(jf(a,k-1)?TT:'');
  const other=sy.map(s=>sylT(a,s[0],s[1])).find(t=>t!==closed&&t!==open);
  const opts=shuf([{t:closed,ok:true},{t:open,ok:false},{t:other&&other!==altT?other:altT,ok:false}]);
  out.push({w,a,k,open,closed,opts});
 }
 return out;
}
function gAna(i){return U[i][1].filter(w=>{const n=parseW(w).length;return n>=2&&n<=7}).slice(0,3).map(w=>{const a=parseW(w);return{w,a,sy:syls(a),step:0}})}
function gPic(i){
 const t=nz(U[i][0]),ws=U[i][1],has=w=>PIC[w];
 let c=ws.filter(has);
 if(c.length<3)c=[...c,...POOL.filter(w=>has(w)&&!c.includes(w)&&nz(w).includes(t))];
 if(c.length<3)c=[...c,...POOL.filter(w=>has(w)&&!c.includes(w))];
 const all=[...new Set(Object.values(PIC))];
 return c.slice(0,3).map(w=>{const p=PIC[w],d=shuf(all.filter(x=>x!==p)).slice(0,2);return{w,p,opts:shuf([{t:p,ok:true},...d.map(t=>({t,ok:false}))])}});
}
function gSent(i){
 const sn=U[i][2];if(!sn)return [];const words=sn.split(' '),t=nz(U[i][0]);
 const idx=words.map((w,k)=>k).filter(k=>plain(words[k]).length>=3);
 const pref=idx.filter(k=>nz(words[k]).includes(t)),rest=idx.filter(k=>!pref.includes(k));
 const pick=[...pref,...rest].slice(0,2);
 return pick.map(k=>{const c=words[k],d=shuf([...U[i][1],...POOL].filter(w=>w!==c&&!words.includes(w)&&plain(w).length>=3)).slice(0,2);
  return{sn,words,k,opts:shuf([{t:c,ok:true},...d.map(t=>({t,ok:false}))])}});
}
function G(kind,i){
 const r={w:gWords,f:gForms,m:gMadd,s:gSuk,a:gAna,p:gPic,r:gSent}[kind](i);
 if(!r.length)return;S={g:kind,i,r,k:0,res:[]};gr();
}
const gTop=()=>`<div class="qtop"><button class="alt" onclick="learn(${S.i})">رجوع</button><span class="chip2">${GN[S.g]}</span>${dotsH(S.r.length,S.k)}</div>`;

function gwPick(j){
 const R=S.r[S.k];if(R.done)return;const t=R.tray[j],bs=$('#tr').children;if(bs[j].disabled)return;const e=R.a[R.n];
 if(t.key===e.b+e.m){
  bs[j].disabled=true;const s=$('#s'+R.n);s.textContent=shp(R.a,R.n);s.classList.add('f');R.n++;$('#rk').style.setProperty('--p',R.n/R.a.length);

  $('#msg').innerHTML=`<div class="fb hint">ليس هذا المقطع. اضغط على 🔊 واستمع إلى الكلمة ثم حاول.</div>`+(R.tries>=3?`<div class="ghost">${esc(R.w)}</div>`:'')}

function gfPick(j){
 const R=S.r[S.k];if(R.done)return;const o=R.opts[j],b=$('#op').children[j];
 if(o.f===R.f){R.done=1;b.classList.add('g');$('#wl').innerHTML=fullH(R.a);$('#msg').innerHTML=`<div class="fb ok">${praise()} الحرف ${FN[R.f]}</div>`;gDone(R)}
 else{R.tries++;b.classList.add('r');b.disabled=true;$('#msg').innerHTML=`<div class="fb hint">انظر إلى الخطّ الذي يصل الحرف بما قبله وبما بعده: هل يتصل بالحرف الذي قبله؟ وهل يتصل بالذي بعده؟</div>`}
}
function gmPick(j){
 const R=S.r[S.k];if(R.done)return;const f=R.fs[j],b=$('#op').children[j];
 if(f[0]===R.md){R.done=1;b.classList.add('caught');$('#bx').textContent=R.md;$('#bx').style.cssText='border-style:solid;border-color:var(--green);color:var(--green)';
  $('#sylb').setAttribute('data-say',R.c+R.m+R.md);if(R.a)$('#wl').innerHTML=fullH(R.a);
  $('#msg').innerHTML=`<div class="fb ok">${praise()} بعد ${MM[R.m][1]} نكتب ${MDN[R.md]}</div>`;gDone(R)}
 else{R.tries++;b.classList.add('shake','r');b.disabled=true;$('#msg').innerHTML=`<div class="fb hint">فكّر: ${MM[R.m][1]} يتبعها حرف المدّ ${MDN[R.md]}.</div>`}
}
function gsOpen(j){
 const R=S.r[S.k],b=$('#wn'+j);if(b.classList.contains('op'))return;
 b.textContent=b.dataset.t;b.classList.add('op');b.setAttribute('data-say',b.dataset.t);
 if(j<2){const n=$('#wn'+(j+1));n.disabled=false;n.classList.remove('lock')}
 else $('#q2').innerHTML=`<div class="gtitle" style="margin-top:6px">أيّ مقطع فيه سكون ( ْ )؟</div><div class="fopts" id="op">${R.opts.map((o,x)=>`<button class="o t" onclick="gsPick(${x})">${o.t}</button>`).join('')}</div>`;
}
function gsPick(j){
 const R=S.r[S.k];if(R.done)return;const o=R.opts[j],b=$('#op').children[j];
 if(o.ok){R.done=1;b.classList.add('g');$('#msg').innerHTML=`<div class="fb ok">${praise()} السكون علامة تعني أن الحرف ساكن، لا حركة له.</div>`;gDone(R)}
 else{R.tries++;b.classList.add('r');b.disabled=true;$('#msg').innerHTML=`<div class="fb hint">ابحث عن المقطع الذي ينتهي بحرف عليه سكون ( ْ ).</div>`}
}
function gaPick(j){
 const R=S.r[S.k];if(R.done||R.busy)return;const o=R.opts[j],b=$('#op').children[j];
 if(o.ok){b.classList.add('g');
  if(!R.step){R.busy=1;$('#msg').innerHTML=`<div class="fb ok">${praise()} ${'👏'.repeat(R.sy.length)} الكلمة ${R.sy.length} ${R.sy.length>2?'مقاطع':R.sy.length===2?'مقطعان':'مقطع'}</div>`;setTimeout(()=>{R.step=1;R.busy=0;$('#msg').innerHTML='';gaQ(R)},1300)}
  else{R.done=1;$('#qa').innerHTML=`<h3 style="text-align:center">المقاطع</h3><div class="row">${R.sy.map((s,x)=>`<span class="syb" style="--h:${HUE(x*3)}">${sylT(R.a,s[0],s[1])}</span>`).join('')}</div><h3 style="text-align:center;margin-top:10px">الحروف (${R.a.length})</h3><div class="lets">${R.a.map(x=>`<span>${x.b}</span>`).join('')}</div>`;
   $('#msg').innerHTML=`<div class="fb ok">${praise()}</div>`;gDone(R,1)}
 }else{R.tries++;b.classList.add('r');b.disabled=true;$('#msg').innerHTML=`<div class="fb hint">${R.step?'عُدّ الحروف واحدًا واحدًا. الشدّة لا تُعدّ حرفًا جديدًا.':'انطق الكلمة ببطء وصفّق عند كل مقطع.'}</div>`}
}
function gpPick(j){
 const R=S.r[S.k];if(R.done)return;const o=R.opts[j],b=$('#op').children[j];
 if(o.ok){R.done=1;b.classList.add('g');$('#msg').innerHTML=`<div class="fb ok">${praise()}</div>`;gDone(R)}
 else{R.tries++;b.classList.add('r');b.disabled=true;$('#msg').innerHTML=`<div class="fb hint">اقرأ الكلمة حرفًا حرفًا ثم انظر إلى الصور.</div>`}
}
function grPick(j){
 const R=S.r[S.k];if(R.done)return;const o=R.opts[j],b=$('#op').children[j];
 if(o.ok){R.done=1;b.classList.add('g');$('#wl').innerHTML=`<span class="fx">${esc(R.sn)}</span>`;$('#msg').innerHTML=`<div class="fb ok">${praise()}</div>`;gDone(R)}
 else{R.tries++;b.classList.add('r');b.disabled=true;$('#msg').innerHTML=`<div class="fb hint">أعد قراءة الجملة، وفكّر: أيّ كلمة تناسب المعنى؟</div>`}
}
function gDone(R,manual){
 if(R.logged)return;R.logged=1;S.res.push(R.tries===0);burst();log({letter:ORD[S.i],skill:'لعبة: '+GN[S.g],ok:R.tries===0,tries:R.tries});
 if(manual){const last=S.k+1>=S.r.length;$('#msg').insertAdjacentHTML('beforeend',`<p class="row" style="margin-top:12px"><button class="go" onclick="S.k++;gr()">${last?'إنهاء اللعبة':'الكلمة التالية'}</button><button class="alt" onclick="learn(S.i)">رجوع</button></p>`);return}
 setTimeout(()=>{S.k++;gr()},1900);
}
function gEnd(){
 const good=S.res.filter(Boolean).length,p=Math.round(good/S.r.length*100),n=p>=85?3:p>=60?2:1,key=ORD[S.i]+':'+S.g;
 GS[key]=Math.max(GS[key]||0,n);saveLocal();updHd();
 const nx=GK[(GK.indexOf(S.g)+1)%GK.length];
 $('#app').innerHTML=`<div class="card big-res"><span class="owl">🦉</span><div class="stars" style="color:var(--sun-d)">${'★'.repeat(n)}</div><h2>أنهيت لعبة «${GN[S.g]}»</h2><p class="mut" style="margin:0">أجبت ${good} من ${S.r.length} من أول مرة</p>
 <button onclick="G('${S.g}',${S.i})">العب مرة أخرى</button><button style="--c:var(${GC[nx][0]});--cd:var(${GC[nx][1]})" onclick="G('${nx}',${S.i})">لعبة «${GN[nx]}»</button><button class="alt" onclick="learn(${S.i})">العودة للحرف</button></div>`;
 burst();
}
/* ---------- teacher dashboard ---------- */
const lvl=p=>p===null?['لم يبدأ','#8a8aa8']:p>=85?['متقن','#12a36f']:p>=60?['جيد','#e08a00']:['يحتاج معالجة','#e5483f'];
const PRINTOK=true;
const pct=r=>r.length?Math.round(r.filter(x=>x.ok).length/r.length*100):null;
function dash(sel){
 const a=$('#app');
 if(!isT){a.innerHTML='<div class="card">لوحة المعلمة تظهر لصاحبة الصفحة فقط.</div><button onclick="home()">رجوع</button>';return}
 if(!fbOn()){a.innerHTML='<div class="card">لم يُربط الحفظ بقاعدة بيانات Firebase بعد.</div><button onclick="home()">رجوع</button>';return}
 a.innerHTML='<div id="dash"><div class="top"><h2>لوحة المعلمة</h2><button class="alt" onclick="home()">رجوع</button></div><div id="dc" class="card">جارٍ التحميل…</div></div>';
 if(unsub)clearInterval(unsub);
 const pull=async()=>{try{const r=await fetch(fbU('results')),o=await r.json()||{};DATA=Object.values(o).sort((x,y)=>y.ts-x.ts).slice(0,3000);paint(sel)}catch(e){const c=$('#dc');if(c)c.textContent='تعذّر تحميل البيانات'}};
 pull();unsub=setInterval(pull,15000);
}
function bars(map,keys){return keys.filter(k=>map[k]).map(k=>{const p=pct(map[k]),l=lvl(p);return `<div class="br"><span class="bk">${esc(k)}</span><div class="bar2"><i style="width:${Math.max(p,3)}%;background:${l[1]}"></i></div><span class="bp">${p}%</span></div>`}).join('')}
function group(rs,f){const m={};rs.forEach(r=>{(m[f(r)]=m[f(r)]||[]).push(r)});return m}
const sk0=s=>String(s).replace('لعبة: ','');
function paint(sel){
 const el=$('#dc');if(!el)return;
 const by=group(DATA,r=>r.name),names=Object.keys(by).sort();
 let h='';
 if(!names.length){el.innerHTML='<h3>لا توجد نتائج بعد</h3><p class="mut">عندما يجيب الطلاب عن الأسئلة تظهر هنا الرسوم والتحليل. شاركي رابط الطلاب معهم.</p>'+tail();return}
 const all=pct(DATA),pr=names.map(n=>pct(by[n])),cnt={m:0,g:0,w:0};pr.forEach(p=>{p>=85?cnt.m++:p>=60?cnt.g++:cnt.w++});
 const byL=group(DATA,r=>r.letter),bySk=group(DATA,r=>sk0(r.skill));
 const lk=ORD.filter(k=>byL[k]),sk=Object.keys(bySk).sort((a,b)=>pct(bySk[a])-pct(bySk[b]));
 const wl=[...lk].sort((a,b)=>pct(byL[a])-pct(byL[b])).filter(k=>pct(byL[k])<85).slice(0,3);
 const ws=sk.filter(k=>pct(bySk[k])<85).slice(0,2);
 const need=names.filter((n,i)=>pr[i]<60);
 const dateS=new Date().toLocaleDateString('ar-SA');
 if(sel&&by[sel]){
  const r=by[sel],s2=group(r,x=>sk0(x.skill)),l2=group(r,x=>x.letter),p=pct(r),l=lvl(p);
  const sks=Object.keys(s2).sort((a,b)=>pct(s2[a])-pct(s2[b]));
  const wk=sks.filter(k=>pct(s2[k])<85).slice(0,3);
  h+=`<div class="top"><h3>تقرير الطالب: ${esc(sel)}</h3><button class="alt noprint" onclick="dash()">كل الصف</button></div>
  <div class="kpis"><div><b>${p}%</b><span>الدقة العامة</span></div><div><b>${r.length}</b><span>إجابة</span></div><div><b>${Object.keys(l2).length}</b><span>حرف</span></div><div><b style="color:${l[1]}">${l[0]}</b><span>المستوى</span></div></div>
  <div class="ins">${wk.length?`تحتاج ${esc(sel)} إلى مزيد من التدريب في: ${wk.map(esc).join('، ')}.`:'أداء ممتاز في جميع المهارات التي جرّبها.'}</div>
  <h3>الدقة حسب الحرف</h3><div class="chart">${bars(l2,ORD)}</div>
  <h3>الدقة حسب المهارة</h3><div class="chart">${bars(s2,sks)}</div>`;
 }else{
  const tot=names.length;
  h+=`<div class="top"><h3>تقرير الصف</h3><span class="mut">${dateS}</span></div>
  <div class="kpis"><div><b>${tot}</b><span>طالبًا</span></div><div><b>${DATA.length}</b><span>إجابة</span></div><div><b>${all}%</b><span>دقة الصف</span></div><div><b style="color:#e5483f">${cnt.w}</b><span>يحتاجون معالجة</span></div></div>
  <div class="ins">${all>=85?'مستوى الصف ممتاز.':all>=60?'مستوى الصف جيد، مع مهارات تحتاج تعزيزًا.':'يحتاج الصف إلى تعزيز واسع.'}${wl.length?` أضعف الحروف: ${wl.map(k=>k+' ('+pct(byL[k])+'%)').join('، ')}.`:''}${ws.length?` أضعف المهارات: ${ws.map(k=>k+' ('+pct(bySk[k])+'%)').join('، ')}.`:''}</div>
  <h3>توزيع مستويات الطلاب</h3>
  <div class="stack"><i style="flex:${cnt.m};background:#12a36f"></i><i style="flex:${cnt.g};background:#e08a00"></i><i style="flex:${cnt.w};background:#e5483f"></i></div>
  <div class="leg"><span><u style="background:#12a36f"></u>متقن ${cnt.m}</span><span><u style="background:#e08a00"></u>جيد ${cnt.g}</span><span><u style="background:#e5483f"></u>يحتاج معالجة ${cnt.w}</span></div>
  <h3>الدقة حسب الحرف</h3><div class="chart">${bars(byL,lk)}</div>
  <h3>الدقة حسب المهارة (الأضعف أولًا)</h3><div class="chart">${bars(bySk,sk)}</div>
  ${need.length?`<h3>طلاب يحتاجون معالجة</h3><div class="note" style="background:#ffe3e0;color:#7a1e16">${need.map(n=>{const s3=group(by[n],x=>sk0(x.skill)),w=Object.keys(s3).filter(k=>pct(s3[k])<60).slice(0,2);return `<div><b>${esc(n)}</b> ${pct(by[n])}%${w.length?' — '+w.map(esc).join('، '):''}</div>`}).join('')}</div>`:''}
  <h3>الطلاب</h3><div class="chart">${names.map((n,i)=>{const p=pr[i],l=lvl(p);return `<div class="br" onclick='dash(${JSON.stringify(n).replace(/'/g,"&#39;")})' style="cursor:pointer"><span class="bk" style="width:auto;min-width:70px">${esc(n)}</span><div class="bar2"><i style="width:${Math.max(p,3)}%;background:${l[1]}"></i></div><span class="bp">${p}%</span></div>`}).join('')}</div><p class="mut noprint">اضغطي اسم الطالب لعرض تقريره.</p>`;
 }
 el.innerHTML=h+tail();
}
function tail(){return `<div class="noprint"><hr><h3>الحروف المنشورة للطلاب</h3><div class="minis">${W.map(w=>`<button class="mini ${open(w[0])?'on':''}" onclick="tog('${w[0]}')">${w[0]}</button>`).join('')}</div>
 <p class="mut">الأخضر منشور، والرمادي مغلق. اضغطي لتغيير الحالة.</p><p class="row">${PRINTOK?'<button onclick="window.print()">طباعة / حفظ PDF</button>':''}<button class="alt" onclick="csv()">تنزيل البيانات CSV</button></p></div>`}

function tog(L){
 const cur=PUB||W.map(w=>w[0]);
 const nx=cur.includes(L)?cur.filter(x=>x!==L):[...cur,L];
 PUB=nx;if(fbOn())try{fetch(fbU('config/open'),{method:'PUT',body:JSON.stringify(nx)}).catch(()=>{})}catch(e){}
 paint();
}
function csv(){
 const rows=['الاسم,الحرف,المهارة,صحيح من أول مرة,المحاولات الخاطئة,التاريخ',...DATA.map(r=>[r.name,r.letter,r.skill,r.ok?1:0,r.tries,new Date(r.ts).toISOString()].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv'}));a.download='lughati-report.csv';document.body.appendChild(a);a.click();a.remove();
}
init();
</script>

</body>
</html>
