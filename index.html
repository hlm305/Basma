<style>
:root{--paper:#fff7e4;--ink:#1d2b53;--green:#0b6e4f;--green-d:#08543c;--sun:#ffc23d;--sun-d:#d99a00;--line:#ecdcb0;--mut:#5f6a8f;--bad:#b03a2e;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:var(--paper);background-image:radial-gradient(var(--line) 1.3px,transparent 1.5px);background-size:26px 26px;color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.box{width:100%;max-width:380px;background:#fff;border:3px solid var(--line);border-radius:28px;box-shadow:0 7px 0 var(--line);padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:14px}
.owl{width:76px;height:76px;margin:0 auto;display:grid;place-items:center;background:var(--sun);border-radius:24px;font-size:48px;box-shadow:0 6px 0 var(--sun-d)}
h1{margin:0;font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-size:32px;color:var(--green);line-height:1.3}
p{margin:0;color:var(--mut);font-weight:500}
input[type=password]{font:inherit;font-size:20px;text-align:center;letter-spacing:2px;padding:12px;border:2px solid var(--line);border-radius:16px;width:100%;direction:ltr;background:var(--paper);color:var(--ink)}
input[type=password]:focus{outline:3px solid var(--sun);border-color:var(--green)}
label.rem{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:700;font-size:15px}
button{font:inherit;font-weight:900;font-size:19px;border:0;border-radius:16px;padding:12px;background:var(--green);color:#fff7e4;box-shadow:0 5px 0 var(--green-d);cursor:pointer}
button:disabled{opacity:.7}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
small{color:var(--mut)}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="owl" aria-hidden="true">🦉</div>
  <h1>فاطمة المطيري</h1>
  <p>هذه الصفحة خاصة. أدخلي الرمز لعرض الأعمال.</p>
  <input type="password" id="pw" autocomplete="current-password" placeholder="الرمز" aria-label="الرمز" autofocus>
  <label class="rem"><input type="checkbox" id="rem" checked> تذكّرني على هذا الجهاز</label>
  <button id="go">دخول</button>
  <div class="err" id="err" role="alert"></div>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K='fm_home_key';
async function dec(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){const go=()=>setTimeout(()=>{document.open();document.write(html);document.close();},0);document.readyState==='loading'?document.addEventListener('DOMContentLoaded',go):go();}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,256));
}
(async()=>{try{const r=JSON.parse(localStorage.getItem(K)||'null');if(r&&r.e>Date.now()){show(await dec(u(r.k)));return;}}catch(e){try{localStorage.removeItem(K)}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err');
  b.disabled=true;b.textContent='جاري الفتح…';er.textContent='';
  try{const raw=await derive(document.getElementById('pw').value.trim());
    const html=await dec(raw);
    if(document.getElementById('rem').checked){try{localStorage.setItem(K,JSON.stringify({k:btoa(String.fromCharCode(...raw)),e:Date.now()+30*864e5}))}catch(_){}}
    show(html);
  }catch(x){er.textContent='الرمز غير صحيح، حاولي مرة ثانية';b.disabled=false;b.textContent='دخول';}
