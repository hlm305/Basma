<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المادة 34 – بصمة دفاع</title>
<style>
:root{--bg1:#fdf3ea;--bg2:#f1dccb;--ink:#26211e;--sub:#5b4f48;--g1:#1b5a2c;--g2:#4aa162;--gold:#b88a2e;--gold2:#e2bd62;--red:#c0392b;--glass:rgba(255,255,255,.65);--bd:rgba(184,138,46,.35);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0e3a20;--bg2:#04150b;--ink:#f6efe3;--sub:#cdbfa8;--g1:#1f6b34;--g2:#7ad193;--gold:#d8ad4a;--gold2:#f3d78a;--red:#ef5b4b;--glass:rgba(255,255,255,.07);--bd:rgba(226,189,98,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#0e3a20;--bg2:#04150b;--ink:#f6efe3;--sub:#cdbfa8;--g1:#1f6b34;--g2:#7ad193;--gold:#d8ad4a;--gold2:#f3d78a;--red:#ef5b4b;--glass:rgba(255,255,255,.07);--bd:rgba(226,189,98,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;text-align:center;background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
.wrap{max-width:540px;margin:0 auto;padding:22px 16px 44px;position:relative}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--gold);font-size:14px;letter-spacing:2px;margin-bottom:6px}
.orn i{height:1.5px;width:64px;background:linear-gradient(90deg,transparent,var(--gold));display:block}
.orn i:last-child{transform:scaleX(-1)}
h1{margin:0;font-size:3.3rem;font-weight:800;line-height:1.2;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.sub{font-size:1.08rem;line-height:2;color:var(--sub);margin:2px 0 4px}
.stage{position:relative;width:min(88%,340px);margin:6px auto 0}
.stage svg{width:100%;height:auto;display:block;overflow:visible}
.glow{position:absolute;inset:12% 8%;border-radius:50%;background:radial-gradient(circle,var(--g2),transparent 68%);opacity:.38;filter:blur(28px);animation:pulse 3.4s ease-in-out infinite;z-index:0}
.stage svg{position:relative;z-index:1}
@keyframes pulse{50%{opacity:.62;transform:scale(1.08)}}
.scan{animation:scan 3.4s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(-6px)}50%{transform:translateY(160px)}}
#ridges ellipse{animation:drift 14s linear infinite}
@keyframes drift{to{stroke-dashoffset:-120}}
.slogan{font-size:2rem;font-weight:800;margin:12px 0 10px;line-height:1.5}
.slogan b{color:var(--red);text-shadow:0 0 18px rgba(239,91,75,.35)}
.ribbon{position:relative;margin:6px 0 12px;padding:12px 8px;min-height:62px;display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-content:center;background:var(--glass);border:1px solid var(--bd);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 0 0 4px transparent}
.ribbon::before,.ribbon::after{content:"";position:absolute;left:12px;right:12px;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.ribbon::before{top:-1px}.ribbon::after{bottom:-1px}
.h{font-size:21px;line-height:1;animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.6)}100%{transform:scale(1)}}
.counter{display:inline-flex;flex-direction:column;align-items:center;padding:8px 26px;margin:2px 0 16px;border:1px solid var(--bd);border-radius:16px;background:var(--glass)}
.counter small{color:var(--sub);font-size:.9rem}
.counter span{font-size:2.3rem;font-weight:800;color:var(--red);line-height:1.2;font-variant-numeric:tabular-nums}
.msg{min-height:1.6em;font-weight:700;color:var(--gold2);margin:-6px 0 10px;transition:opacity .4s}
.btnwrap{position:relative;width:156px;height:156px;margin:0 auto}
.btnwrap::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,var(--gold2),transparent 30%,var(--gold),transparent 60%,var(--gold2));animation:spin 5s linear infinite;-webkit-mask:radial-gradient(circle,transparent 66%,#000 67%);mask:radial-gradient(circle,transparent 66%,#000 67%)}
@keyframes spin{to{transform:rotate(360deg)}}
#btn{position:absolute;inset:0;border-radius:50%;border:0;padding:0;cursor:pointer;background:radial-gradient(circle at 32% 26%,var(--g2),var(--g1) 70%);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 2px 8px rgba(255,255,255,.35);-webkit-tap-highlight-color:transparent;transition:transform .12s}
#btn:active{transform:scale(.92)}
#btn svg{width:76%;height:76%;margin:12%;filter:drop-shadow(0 0 6px rgba(255,255,255,.55))}
#btn.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--red);animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:scale(1.7);opacity:0}}
.hint{margin-top:14px;font-weight:700;color:var(--sub)}
.credit{margin-top:26px;padding:16px 14px;border:1px solid var(--bd);border-radius:18px;background:var(--glass);line-height:2}
.credit .b{font-size:1.15rem;font-weight:800;color:var(--gold2)}
.credit .d{height:1.5px;width:70%;margin:6px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.credit .t{font-size:1.02rem;color:var(--ink)}
.fly{position:fixed;pointer-events:none;z-index:9;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),-170px) rotate(var(--r));opacity:0}}
html,body{height:100%;overflow:hidden}
body{position:relative}
.wrap{position:absolute;left:0;top:0;width:1280px;height:720px;max-width:none;transform-origin:0 0;display:grid;grid-template-columns:1fr 1fr;column-gap:48px;align-items:center;padding:20px 48px}
.wrap>*{grid-column:2}
.wrap>.stage{grid-column:1;grid-row:1/span 12;width:100%;max-width:560px;margin:0 auto;align-self:center}
.orn{display:none}
h1{font-size:54px}
.sub{font-size:18px;line-height:1.7;margin:0}
.slogan{font-size:34px;margin:6px 0 6px}
.ribbon{min-height:56px;max-height:92px;overflow:hidden;margin:4px 0 8px;padding:10px 8px}
.h{font-size:20px}
.counter{justify-self:center;padding:4px 26px;margin:0 0 6px}
.counter span{font-size:36px}
.msg{min-height:1.4em;margin:0 0 6px}
.btnwrap{width:120px;height:120px}
.hint{margin-top:10px}
.credit{margin-top:12px;padding:8px 12px;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="orn"><i></i>★ ★ ★<i></i></div>
  <h1>المادة 34</h1>
  <div class="sub">الدفاع عن العقيدة الإسلامية، والمجتمع، والوطن<br>واجب على كل مواطن</div>
  <div class="stage">
    <div class="glow"></div>
    <svg viewBox="0 0 200 170" aria-label="بصمة على خريطة المملكة العربية السعودية">
      <defs>
        <clipPath id="m"><path id="mp" d="M18 22 L50 20 L68 38 L96 50 L112 66 L126 76 L146 84 L152 96 L170 104 L188 120 L184 128 L140 138 L120 138 L104 152 L88 166 L76 156 L74 134 L52 96 L40 76 L26 52 Z"/></clipPath>
        <linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="fill" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="var(--g1)"/><stop offset="1" stop-color="var(--g2)" stop-opacity=".55"/></linearGradient>
      </defs>
      <use href="#mp" fill="url(#fill)"/>
      <g clip-path="url(#m)" id="ridges" fill="none" stroke="var(--gold2)" stroke-opacity=".75" stroke-linecap="round"></g>
      <g clip-path="url(#m)"><rect class="scan" x="0" y="0" width="200" height="16" fill="url(#sg)"/></g>
      <use href="#mp" fill="none" stroke="var(--gold2)" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="slogan">بصمة دفاع .. السعودية <b>خط أحمر</b></div>
  <div class="ribbon" id="line" aria-live="polite"></div>
  <div class="counter"><small>عدد البصمات</small><span id="n">0</span></div>
  <div class="msg" id="msg"></div>
  <div class="btnwrap">
    <button id="btn" type="button" aria-label="اترك بصمتك">
      <svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round">
        <path d="M22 34 C28 18 44 12 56 14 C72 17 82 30 80 46"/>
        <path d="M14 52 C12 40 16 30 22 24"/>
        <path d="M30 42 C32 30 42 24 52 25 C64 26 70 36 68 48 C67 58 70 66 74 72"/>
        <path d="M20 62 C18 56 18 52 20 46"/>
        <path d="M40 48 C41 40 47 37 53 38 C59 40 60 46 58 54 C57 62 60 72 64 82"/>
        <path d="M28 58 C27 66 30 76 36 86"/>
        <path d="M49 54 C49 62 50 72 54 90"/>
        <path d="M38 62 C38 70 41 80 46 92"/>
        <path d="M70 80 C72 84 74 88 77 91"/>
      </svg>
    </button>
  </div>
  <div class="hint">اضغطي لتتركي بصمتك ❤️</div>
  <div class="credit">
    <div class="b">بصمة وطن 🇸🇦</div>
    <div class="d"></div>
    <div class="t">الطفولة المبكرة بالابتدائية التاسعة والسبعون بعد المائة</div>
    <div class="t">المعلمة: فاطمة المطيري</div>
  </div>
</div>
<script>
(function(){
  var DB_URL="https://defense-fingerprint-default-rtdb.firebaseio.com";
  var NS="http://www.w3.org/2000/svg",H="\u2764\uFE0F";
  var g=document.getElementById('ridges');
  for(var i=1;i<=32;i++){
    var e=document.createElementNS(NS,'ellipse');
    e.setAttribute('cx',100+Math.sin(i/3)*3);e.setAttribute('cy',92+Math.cos(i/4)*2);
    e.setAttribute('rx',i*4.1);e.setAttribute('ry',i*3.4);
    e.setAttribute('stroke-width',1.2);
    e.setAttribute('stroke-dasharray',(14+i%5*6)+' '+(3+i%4*2));
    e.setAttribute('transform','rotate('+(i*5)+' 100 92)');
    e.style.animationDuration=(10+i%6*3)+'s';
    if(i%2)e.style.animationDirection='reverse';
    g.appendChild(e);
  }
  var line=document.getElementById('line'),nEl=document.getElementById('n'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
  var MAX=400,total=0,shown=0,pending=0,last=0;
  var MILES=[[1000,'ألف بصمة وطن! 🇸🇦'],[500,'٥٠٠ بصمة، ما شاء الله 🌟'],[100,'مئة بصمة وفاء 💚'],[10,'بداية جميلة ✨']];
  function sync(n){
    total=Math.max(total,n);
    nEl.textContent=total.toLocaleString('ar-SA');
    var want=Math.min(total,MAX),f=document.createDocumentFragment();
    while(shown<want){var s=document.createElement('span');s.className='h';s.textContent=H;f.appendChild(s);shown++}
    line.appendChild(f);
  }
  function milestone(){
    for(var k=0;k<MILES.length;k++){if(total>=MILES[k][0]&&last<MILES[k][0]){msg.textContent=MILES[k][1];last=MILES[k][0];setTimeout(function(){msg.textContent=''},3500);break}}
  }
  function burst(){
    var r=btn.getBoundingClientRect();
    for(var k=0;k<5;k++){
      var s=document.createElement('div');s.className='fly';s.textContent=H;
      s.style.fontSize=(18+Math.random()*16)+'px';
      s.style.left=(r.left+r.width/2-12)+'px';s.style.top=(r.top+r.height/3)+'px';
      s.style.setProperty('--dx',(Math.random()*160-80)+'px');
      s.style.setProperty('--r',(Math.random()*60-30)+'deg');
      s.style.animationDelay=(k*60)+'ms';
      document.body.appendChild(s);(function(x){setTimeout(function(){x.remove()},1300)})(s);
    }
  }
  function load(){
    fetch(DB_URL+"/count.json").then(function(r){return r.json()}).then(function(v){sync((v||0)+pending)}).catch(function(){});
  }
  btn.addEventListener('click',function(){
    btn.classList.remove('on');void btn.offsetWidth;btn.classList.add('on');
    burst();total++;pending++;sync(total);milestone();
    if(navigator.vibrate){try{navigator.vibrate(15)}catch(_){}}
    fetch(DB_URL+"/count.json",{method:"PUT",body:JSON.stringify({".sv":{"increment":1}})}).then(function(){pending=Math.max(0,pending-1)}).catch(function(){});
  });
  load();setInterval(load,5000);
  var wr=document.querySelector('.wrap');
  function fit(){
    var W=innerWidth,H=innerHeight,s,t;
    if(W>=H){s=Math.min(W/1280,H/720);t='translate('+(W-1280*s)/2+'px,'+(H-720*s)/2+'px) scale('+s+')'}
    else{s=Math.min(H/1280,W/720);t='translate('+((W-720*s)/2+720*s)+'px,'+(H-1280*s)/2+'px) rotate(90deg) scale('+s+')'}
    wr.style.transform=t;
  }
  fit();addEventListener('resize',fit);addEventListener('orientationchange',fit);
})();
</script>
</body>
</html>
